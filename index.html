<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>消消乐 · XDZ</title><meta name="description" content="交换表情，三个相连，快乐消除。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232b51ed'/%3E%3Cpath d='M8 8h6v6H8zm10 0h6v6h-6zM8 18h6v6H8zm10 0h6v6h-6z' fill='white'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"></head><body><main><header><a class="brand" href="./"><span class="mark">✦</span> XDZ <span class="brand-small">PLAY</span></a><span class="edition">表情消消乐 / 01</span></header><section class="game"><aside><p class="eyebrow">MATCH & SMILE</p><h1>消消乐<span>连起来，消掉它。</span></h1><div class="stats"><div class="score"><span>当前分数</span><strong id="score">0</strong></div><div class="stat-row"><span>成功交换</span><strong id="moves">0</strong></div><div class="stat-row"><span>最高连消</span><strong id="best">0</strong></div></div><button id="restart" class="restart">重新开始 <span>↻</span></button><div class="instructions"><span class="step">怎么玩</span><p>点击或滑动，交换两个相邻图标。横向或纵向连成 <b>3 个及以上</b>相同图标，或凑成 <b>2×2 的四个相同图标</b>，即可消除。</p><p class="small">金色边框的是道具，点击即可使用。</p></div></aside><div class="play"><div class="board-top"><span><i></i>自由模式</span><span id="combo">来一场快乐连消</span></div><div class="board-frame"><div id="board" role="group" aria-label="8行8列消消乐棋盘"></div><div id="float" aria-hidden="true"></div></div><p id="status" role="status" aria-live="polite">三连或 2×2 都能消除，交换相邻表情试试。</p><div class="cast"><span>本场阵容</span><div id="cast"></div><span class="count">6 种表情</span></div><div class="power-guide"><h2>道具图鉴 <span>消除生成 · 点击使用</span></h2><div class="power-list"><div><img src="assets/bomb.jpg" alt="范围炸弹"><p><b>2×2 四连</b><span>清除周围 3×3</span></p></div><div><img src="assets/line.jpg" alt="直线道具"><p><b>直线四连</b><span>清除整行或整列</span></p></div><div><img src="assets/color.jpg" alt="同类全消"><p><b>直线五连</b><span>清除生成它的同类表情</span></p></div><div><img src="assets/cross.png" alt="十字道具"><p><b>横竖交叉</b><span>同时清除所在行和列</span></p></div></div></div></div></section><footer>三连只是开始，连消才是快乐。<span>XDZ · 消消乐</span></footer></main><script src="game.js"></script></body></html>
